model:
  api_key: ${HERMES_CUSTOM_127_0_0_1_20128_API_KEY}
  base_url: http://127.0.0.1:20128/v1
  default: code
  provider: custom
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 500
  personalities: {}
  reasoning_effort: medium
  verbose: false
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  busy_ack_detail: true
  cleanup_progress: false
  long_running_notifications: true
  tool_progress: all
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
delegation:
  max_iterations: 250
skills:
  creation_nudge_interval: 15
plugins:
  enabled:
    - superpowers
  disabled: []
kanban:
  review_dispatch: true
code_execution:
  max_tool_calls: 50
  timeout: 300
streaming:
  enabled: false
onboarding:
  seen:
    profile_build_offered: true
    tool_progress_prompt: true
    busy_input_prompt: true
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 39
custom_providers:
  - base_url: http://127.0.0.1:20128/v1
    key_env: HERMES_CUSTOM_127_0_0_1_20128_API_KEY
    model: code
    models:
      code:
        context_length: 512000
    name: Local (127.0.0.1:20128)
API_SERVER_ENABLED: true
API_SERVER_HOST: 0.0.0.0
API_SERVER_PORT: 8642
API_SERVER_KEY: ${HERMES_CUSTOM_127_0_0_1_20128_API_KEY}
group_sessions_per_user: true
mcp_servers:
  codegraph:
    args:
      - -c
      - cd /home/runner/h-dashboard && /home/runner/.npm-global/bin/codegraph serve
        --mcp
    command: sh
    connect_timeout: 60
    enabled: true
    timeout: 120
  context7:
    url: https://mcp.context7.com/mcp
    enabled: true
  laravel_boost:
    args:
      - -c
      - cd /home/runner/h-dashboard && php artisan boost:mcp
    command: sh
    env:
      APP_ENV: local
  github:
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-github'
      - --env
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GH_TOKEN}
      - --connect-timeout
      - '60'
    enabled: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
session_reset:
  at_hour: 5
  idle_minutes: 1440
  mode: none
